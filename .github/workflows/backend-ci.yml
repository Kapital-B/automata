name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "svc/**"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "svc/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: svc/go.mod
          cache-dependency-path: svc/go.sum

      - name: Run go test
        run: go test ./...

  plan:
    name: Plan (${{ matrix.env.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - name: dev
            aws_region: "eu-west-2"
            backend_region: "eu-west-2"
            state_key: "dev/automata.tfstate"
            role_arn_var: "AUTOMATA_AWS_DEV_ROLE_ARN"
            state_bucket_var: "AUTOMATA_AWS_DEV_STATE_BUCKET"
            lock_table_var: "AUTOMATA_AWS_DEV_LOCK_TABLE"
          # - name: prod
          #   aws_region: "eu-west-2"
          #   backend_region: "eu-west-2"
          #   state_key: "prod/automata.tfstate"
          #   role_arn_var: "AUTOMATA_AWS_PROD_ROLE_ARN"
          #   state_bucket_var: "AUTOMATA_AWS_PROD_STATE_BUCKET"
          #   lock_table_var: "AUTOMATA_AWS_PROD_LOCK_TABLE"
    defaults:
      run:
        working-directory: svc/terraform/envs/${{ matrix.env.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: svc/go.mod
          cache-dependency-path: svc/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.env.role_arn_var] }}
          aws-region: ${{ matrix.env.aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Smoke test Lambda archives
        working-directory: svc
        run: |
          set -euo pipefail
          rm -rf dist
          for entrypoint in api scheduler worker migrate; do
            mkdir -p "dist/${entrypoint}"
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o "dist/${entrypoint}/bootstrap" "./cmd/${entrypoint}"
            chmod +x "dist/${entrypoint}/bootstrap"
            (
              cd "dist/${entrypoint}"
              zip -qr "../${entrypoint}.zip" bootstrap
            )
          done
          python - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("dist")
          for archive in sorted(root.glob("*.zip")):
              with zipfile.ZipFile(archive) as zf:
                  names = zf.namelist()
                  if names != ["bootstrap"]:
                      raise SystemExit(f"{archive.name}: expected only bootstrap at zip root, got {names}")
                  mode = zf.getinfo("bootstrap").external_attr >> 16
                  if mode & 0o111 == 0:
                      raise SystemExit(f"{archive.name}: bootstrap is not executable")
          PY

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ vars[matrix.env.state_bucket_var] }}"
          key            = "${{ matrix.env.state_key }}"
          region         = "${{ matrix.env.backend_region }}"
          dynamodb_table = "${{ vars[matrix.env.lock_table_var] }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform format check
        working-directory: svc/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Ensure lock files unchanged
        run: git diff --exit-code -- ../../

      - name: Terraform plan
        run: terraform plan -no-color | tee plan.txt

      - name: Capture plan output
        if: github.event_name == 'pull_request'
        id: capture_plan
        run: |
          filtered=$(grep -v "Refreshing state" plan.txt)
          if echo "$filtered" | grep -q "No changes. Your infrastructure matches the configuration"; then
            echo "plan_output=No changes. Your infrastructure matches the configuration." >> "$GITHUB_OUTPUT"
          else
            echo "plan_output<<EOF" >> "$GITHUB_OUTPUT"
            echo "$filtered" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment with Terraform plan
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan-${{ matrix.env.name }}-backend
          message: |
            **Environment:** `${{ matrix.env.name }}`

            ```diff
            ${{ steps.capture_plan.outputs.plan_output }}
            ```

  apply-dev:
    name: Apply (dev)
    needs: plan
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: dev
    defaults:
      run:
        working-directory: svc/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: svc/go.mod
          cache-dependency-path: svc/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AUTOMATA_AWS_DEV_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ vars.AUTOMATA_AWS_DEV_STATE_BUCKET }}"
          key            = "dev/automata.tfstate"
          region         = "eu-west-2"
          dynamodb_table = "${{ vars.AUTOMATA_AWS_DEV_LOCK_TABLE }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform apply
        run: terraform apply -auto-approve


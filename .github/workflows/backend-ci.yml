name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "svc/**"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "svc/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: svc/go.mod
          cache-dependency-path: svc/go.sum

      - name: Run go test
        run: go test ./...

  plan:
    name: Plan (${{ matrix.env.name }})
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ matrix.env.name }}
    strategy:
      matrix:
        env:
          - name: dev-eu-west-1-a
            tf_env: dev
            aws_region: "eu-west-1"
            backend_region: "eu-west-1"
            state_key: "automata.tfstate"
            role_arn: "arn:aws:iam::262258604158:role/CloudManagerDeploy-automata-dev-eu-west-1-a"
            state_bucket: "automata-dev-terraform-state"
            lock_table: "automata-lock-table"
          # - name: prod-eu-west-1-a
          #   tf_env: prod
          #   aws_region: "eu-west-1"
          #   backend_region: "eu-west-1"
          #   state_key: "prod/automata.tfstate"
          #   role_arn: "arn:aws:iam::ACCOUNT:role/CloudManagerDeploy-automata-prod-eu-west-1-a"
          #   state_bucket: "automata-prod-terraform-state"
          #   lock_table: "automata-lock-table"
    defaults:
      run:
        working-directory: svc/terraform/envs/${{ matrix.env.tf_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: svc/go.mod
          cache-dependency-path: svc/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.env.role_arn }}
          aws-region: ${{ matrix.env.aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ matrix.env.state_bucket }}"
          key            = "${{ matrix.env.state_key }}"
          region         = "${{ matrix.env.backend_region }}"
          dynamodb_table = "${{ matrix.env.lock_table }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Write terraform.tfvars
        env:
          MS_CLIENT_ID: 0def669d-5c56-4295-84ae-c685aed1332d
          GOOGLE_CLIENT_ID: 703295674009-svkgao4hm259ovpmhl74qmivkl93vrr0.apps.googleusercontent.com
          SLACK_CLIENT_ID: ""
          SLACK_MODE: "oauth"
        run: |
          set -euo pipefail
          if [ -z "${MS_CLIENT_ID}" ]; then
            echo "Missing GitHub Actions variable MS_CLIENT_ID for environment ${{ matrix.env.name }}" >&2
            exit 1
          fi
          cat > terraform.tfvars <<EOF
          go_arch             = "amd64"
          lambda_architecture = "x86_64"
          ms_client_id        = "${MS_CLIENT_ID}"
          google_client_id    = "${GOOGLE_CLIENT_ID}"
          slack_mode          = "${SLACK_MODE:-oauth}"
          slack_client_id     = "${SLACK_CLIENT_ID}"
          EOF

      - name: Terraform format check
        working-directory: svc/terraform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        run: terraform plan -input=false -no-color | tee plan.txt

      - name: Capture plan output
        if: github.event_name == 'pull_request'
        id: capture_plan
        run: |
          filtered=$(grep -v "Refreshing state" plan.txt)
          if echo "$filtered" | grep -q "No changes. Your infrastructure matches the configuration"; then
            echo "plan_output=No changes. Your infrastructure matches the configuration." >> "$GITHUB_OUTPUT"
          else
            echo "plan_output<<EOF" >> "$GITHUB_OUTPUT"
            echo "$filtered" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment with Terraform plan
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan-${{ matrix.env.name }}-backend
          message: |
            **Environment:** `${{ matrix.env.name }}`

            ```diff
            ${{ steps.capture_plan.outputs.plan_output }}
            ```

  apply-dev:
    name: Apply (dev)
    needs: plan
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: dev-eu-west-1-a
    defaults:
      run:
        working-directory: svc/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: svc/go.mod
          cache-dependency-path: svc/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::262258604158:role/CloudManagerDeploy-automata-dev-eu-west-1-a
          aws-region: eu-west-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "automata-dev-terraform-state"
          key            = "automata.tfstate"
          region         = "eu-west-1"
          dynamodb_table = "automata-lock-table"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Write terraform.tfvars
        env:
          MS_CLIENT_ID: 0def669d-5c56-4295-84ae-c685aed1332d
          GOOGLE_CLIENT_ID: 703295674009-svkgao4hm259ovpmhl74qmivkl93vrr0.apps.googleusercontent.com
          SLACK_CLIENT_ID: ""
          SLACK_MODE: "oauth"
        run: |
          set -euo pipefail
          if [ -z "${MS_CLIENT_ID}" ]; then
            echo "Missing GitHub Actions variable MS_CLIENT_ID for environment dev-eu-west-1-a" >&2
            exit 1
          fi
          cat > terraform.tfvars <<EOF
          go_arch             = "amd64"
          lambda_architecture = "x86_64"
          ms_client_id        = "${MS_CLIENT_ID}"
          google_client_id    = "${GOOGLE_CLIENT_ID}"
          slack_mode          = "${SLACK_MODE:-oauth}"
          slack_client_id     = "${SLACK_CLIENT_ID}"
          EOF

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

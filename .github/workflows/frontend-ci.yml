name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "web/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Web quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

  plan:
    name: Plan (${{ matrix.env.name }})
    needs: quality
    runs-on: ubuntu-latest
    environment: ${{ matrix.env.name }}
    strategy:
      matrix:
        env:
          - name: dev-us-east-1-a
            tf_env: dev
            aws_region: "us-east-1"
            backend_region: "us-east-1"
            state_key: "automata_web.tfstate"
            role_arn: "arn:aws:iam::179923445089:role/CloudManagerDeploy-automata-front-end-dev-us-east-1-a"
            state_bucket: "automata-web-dev-terraform-state"
            lock_table: "automata_web-lock-table"
          # - name: prod-us-east-1-a
          #   tf_env: prod
          #   aws_region: "us-east-1"
          #   backend_region: "us-east-1"
          #   state_key: "prod/automata_web.tfstate"
          #   role_arn: "arn:aws:iam::ACCOUNT:role/CloudManagerDeploy-automata-front-end-prod-us-east-1-a"
          #   state_bucket: "automata-web-prod-terraform-state"
          #   lock_table: "automata_web-lock-table"
    defaults:
      run:
        working-directory: web/terraform/envs/${{ matrix.env.tf_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.env.role_arn }}
          aws-region: ${{ matrix.env.aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "${{ matrix.env.state_bucket }}"
          key            = "${{ matrix.env.state_key }}"
          region         = "${{ matrix.env.backend_region }}"
          dynamodb_table = "${{ matrix.env.lock_table }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform format check
        working-directory: web/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color | tee plan.txt

      - name: Capture plan output
        if: github.event_name == 'pull_request'
        id: capture_plan
        run: |
          filtered=$(grep -v "Refreshing state" plan.txt)
          if echo "$filtered" | grep -q "No changes. Your infrastructure matches the configuration"; then
            echo "plan_output=No changes. Your infrastructure matches the configuration." >> "$GITHUB_OUTPUT"
          else
            echo "plan_output<<EOF" >> "$GITHUB_OUTPUT"
            echo "$filtered" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment with Terraform plan
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan-${{ matrix.env.name }}-frontend
          message: |
            **Environment:** `${{ matrix.env.name }}`

            ```diff
            ${{ steps.capture_plan.outputs.plan_output }}
            ```

  apply-dev:
    name: Apply (dev)
    needs: plan
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: dev-us-east-1-a
    defaults:
      run:
        working-directory: web/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::179923445089:role/CloudManagerDeploy-automata-front-end-dev-us-east-1-a
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.3"

      - name: Write backend config
        run: |
          cat > backend.hcl <<EOF
          bucket         = "automata-web-dev-terraform-state"
          key            = "automata_web.tfstate"
          region         = "us-east-1"
          dynamodb_table = "automata_web-lock-table"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform apply
        run: terraform apply -auto-approve
